# Backend test groups. Patterns match filenames in the local tests/ repository.
# A test can protect several components; list it in each relevant group.
# `scripts/test_local.py check` rejects any test file with no group.

[policy]
full_suite_paths = [
  "pyproject.toml", "scripts/test_groups.toml", "scripts/test_local.py",
  "src/alma/api/app.py", "src/alma/api/deps.py", "src/alma/config.py",
  "src/alma/core/db_write.py", "src/alma/core/migrations.py",
  "tests/conftest.py", "tests/_cassette.py", "tests/_helpers.py",
]

[groups.authors]
tests = ["test_author_*.py", "test_authors_*.py", "test_affiliation_*.py", "test_follow_author_*.py", "test_dedup_orcid_*.py", "test_secondary_author_*.py", "test_suggestion_dedup.py", "test_get_purity_followed_authors.py"]
sources = ["src/alma/api/routes/authors.py", "src/alma/application/author*.py", "src/alma/application/followed_authors.py", "src/alma/services/author*.py", "src/alma/core/author*.py", "src/alma/core/fetcher.py"]

[groups.discovery]
tests = ["test_discovery_*.py", "test_branch_*.py", "test_recommendation_*.py", "test_retrieval_*.py", "test_ranking_*.py", "test_ranker_*.py", "test_scoring_*.py", "test_score_*.py", "test_outcome_*.py", "test_default_weights_*.py", "test_exemplar_*.py", "test_directions.py", "test_citation_fabric.py", "test_neighbor_graph.py", "test_cluster_*.py", "test_clustering_*.py", "test_cooccurrence.py", "test_signal_*.py", "test_corpus_paper_feedback.py", "test_venue_monitors.py", "test_find_and_add_ranking.py", "test_dismiss_scope_and_valence.py"]
