# =============================================================================
# ALMa — Docker Compose (the production path)
# =============================================================================
# This file is the one definition of a running ALMa. setup.sh / setup.ps1 and
# scripts/deploy-prod.sh all go through it. It pulls a prebuilt image and never
# builds: docker-compose.build.yml adds the local build for developers.
#
# User-sensitive state lives in NAMED Docker volumes (not host bind-mounts):
#   - alma-data    /app/data   scholar.db + caches + secrets.json + settings.json
#   - alma-config  /app/config plugin configs (slack.config, etc.)
#
# Named volumes are owned by the container's app user, so there is never a
# host-vs-container UID/permission mismatch (the cause of "permission denied"
# on the DB / lock / secrets in bind-mount setups). They survive container
# removal and image upgrades; only `docker volume rm` wipes them. Nothing here
# is baked into the image: the volumes are where personal data stays. See
# docs/operations/backups.md before you copy anything out of them.
#
# Settings go in `.env`, next to this file:
#   ALMA_IMAGE_TAG        image tag. Default `stable`, which moves on a release.
#                         Also stable-gpu, stable-lite, or a version: 0.25.0.
#   ALMA_ALLOWED_ORIGINS  the addresses you open ALMa at, beyond localhost/IPs.
#   BIND_ADDR             host address for the port. Default 127.0.0.1.
#   ALMA_CPUS, ALMA_MEMORY  resource ceilings. Default no CPU cap, 4 GB RAM.
#
# First-time setup, by hand (the installer does this for you):
#   touch .env && chmod 600 .env
#   docker compose pull
#   docker compose up -d --wait
#
# The update is the same two commands: `pull` runs while the old container keeps
# serving, so a failed pull changes nothing. Watchtower also works on this
# container: it pulls the same tag and recreates it with the same settings.
# =============================================================================

# A fixed project name, so the folder holding this file does not decide it.
name: alma

services:
  alma:
    image: ghcr.io/costantinoai/alma-library-manager:${ALMA_IMAGE_TAG:-stable}
    container_name: alma
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Match the image's native non-root app user. Named volumes are initialised
    # from the image's /app/data and /app/config directories, which are writable
    # by UID/GID 10001. Keeping compose on the same UID prevents SQLite sidecar
    # drift (scholar.db-wal / scholar.db-shm owned by a previous runtime user)
    # across image upgrades and rootless/rootful Docker variants.
    #
    # UPGRADING AN EXISTING DEPLOYMENT (was previously run as root / 0:0):
    #   volumes populated under the old UID are root-owned, so this non-root
    #   process can't open the DB ("unable to open database file"). Fix ownership
    #   ONCE, then start normally:
    #       docker compose run --user 0 --rm alma chown -R 10001:10001 /data /config
    #   (See docs/operations/docker-volume-ownership.md — deliberately a loud,
    #   documented migration, not a silent auto-chown entrypoint.)
    # -------------------------------------------------------------------------
    user: "10001:10001"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # The image's root layer is immutable. Anything the app writes must go
    # to a bind-mount or the tmpfs below.
    read_only: true

    tmpfs:
      - /tmp:mode=1777,size=128M

    deploy:
      resources:
        limits:
          # Defaults sized for the `normal` variant — the AI stack
          # (transformers + sklearn) can balloon to ~2 GB once an
          # embedding model is loaded; leave headroom. Override on
          # constrained hosts (Pi: ALMA_MEMORY=1G). CPU stays uncapped by
          # default: Docker refuses to start a container whose limit is above
          # the host's core count, and 0 means no limit.
          cpus: ${ALMA_CPUS:-0}
          memory: ${ALMA_MEMORY:-4G}
        reservations:
          cpus: '0.5'
          memory: 512M

    ports:
      # Bound to localhost (127.0.0.1) ONLY by default — ALMa is reachable
      # only from this machine. ALMa has no login, so never expose it to the
      # open internet. To reach it from other devices on a private network
      # (e.g. a headless Raspberry Pi), override BIND_ADDR=0.0.0.0 — see
      # docs/operations/deployment.md. Format: HOST_IP:HOST_PORT:CONTAINER_PORT
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"

    # -------------------------------------------------------------------------
    # Environment
    # -------------------------------------------------------------------------
    # `env_file` injects values from .env as process env vars at container
    # start (initial credentials). The Settings UI persists key rotations to
    # the secret store inside the alma-data volume — the canonical path for
    # named-volume installs — so there is no host .env write-back.
    env_file:
      - .env

    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # Optional API auth — leave empty for single-user local mode.
      - API_KEY=${API_KEY:-}
      # The addresses you open ALMa at, beyond localhost and IPs. See
      # docs/operations/deployment.md.
      - ALMA_ALLOWED_ORIGINS=${ALMA_ALLOWED_ORIGINS:-}
      # Disable numba JIT cache to avoid Docker filesystem issues with UMAP
      - NUMBA_DISABLE_JITCACHE=1

    # -------------------------------------------------------------------------
    # Named volumes (declared at the bottom of this file). Owned by the
    # container app user — no host UID/permission mismatch. settings.json and
    # secrets.json live INSIDE alma-data (ALMA_SETTINGS_PATH=/app/data/...),
    # so a single data volume holds all writable state.
    # -------------------------------------------------------------------------
    volumes:
      - alma-data:/app/data        # scholar.db, caches, secrets.json, settings.json
      - alma-config:/app/config    # plugin configs (slack.config, …)

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous start_period — first boot runs schema migrations and
      # registers plugins before the API is ready.
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes — stable names (no compose project prefix), the same ones every
# earlier install used, so a library carries over. They survive
# `docker compose down` (use `down -v` to wipe). Owned by the container app user: no host UID/permission mismatch.
volumes:
  alma-data:
    name: alma-data
  alma-config:
    name: alma-config
